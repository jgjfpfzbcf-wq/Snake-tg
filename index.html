<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-main" class="screen active">
        <div class="main-content">
            <div class="logo-container">
                <div class="logo-snake">🐍</div>
                <h1 class="game-logo">SNAKE</h1>
            </div>
            <button id="btn-play" class="btn-main">ИГРАТЬ</button>
            <div class="main-best-box">
                <span class="label">ЛИЧНЫЙ РЕКОРД</span>
                <span id="main-best" class="value">0</span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ИГРА -->
    <div id="screen-game" class="screen hidden">
        <div class="game-header">
            <button id="btn-menu" class="btn-icon">☰</button>
            <div class="score-container">
                <div class="score-box">
                    <span class="label">СЧЁТ</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-box">
                    <span class="label">РЕКОРД</span>
                    <span id="best" class="value">0</span>
                </div>
            </div>
        </div>

        <div class="game-area">
            <div class="canvas-wrapper">
                <canvas id="game"></canvas>
                <div class="hud">
                    <div id="slow-indicator" class="hud-badge hidden">⚡ Замедление</div>
                    <div id="maze-indicator" class="hud-badge hidden">🌀 Лабиринт</div>
                </div>
                <div id="overlay" class="overlay hidden">
                    <div class="overlay-card">
                        <h2 id="overlay-title">Пауза</h2>
                        <p id="overlay-text"></p>
                        <button id="overlay-btn" class="btn-main">Продолжить</button>
                    </div>
                </div>
            </div>

            <div class="dpad-container">
                <div class="dpad">
                    <button class="dpad-btn dpad-up" data-dir="up">▲</button>
                    <button class="dpad-btn dpad-left" data-dir="left">◀</button>
                    <div class="dpad-center"></div>
                    <button class="dpad-btn dpad-right" data-dir="right">▶</button>
                    <button class="dpad-btn dpad-down" data-dir="down">▼</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: МЕНЮ -->
    <div id="modal-menu" class="modal hidden">
        <div class="modal-content">
            <h2>Меню</h2>
            <div class="menu-buttons">
                <button id="menu-resume" class="btn-secondary">▶ Продолжить</button>
                <button id="menu-restart" class="btn-secondary">↻ Заново</button>
                <div class="divider"></div>
                <button id="menu-top" class="btn-secondary">🏆 Топ-10</button>
                <button id="menu-skins" class="btn-secondary">🎨 Скины</button>
                <button id="menu-tasks" class="btn-secondary">📋 Задания</button>
                <button id="menu-achievements" class="btn-secondary">🏅 Достижения</button>
                <button id="menu-settings" class="btn-secondary">⚙️ Настройки</button>
                <div class="divider"></div>
                <button id="menu-exit" class="btn-danger">🚪 Главное меню</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКИ: КОНТЕНТ -->
    <div id="modal-top" class="modal hidden">
        <div class="modal-content">
            <h2>🏆 Топ-10</h2>
            <ol id="top-list" class="top-list"></ol>
            <button class="btn-main close-modal">Закрыть</button>
        </div>
    </div>

    <div id="modal-skins" class="modal hidden">
        <div class="modal-content">
            <h2>🎨 Скины</h2>
            <div id="skins-list" class="skins-list"></div>
            <button class="btn-main close-modal">Закрыть</button>
        </div>
    </div>

    <div id="modal-settings" class="modal hidden">
        <div class="modal-content">
            <h2>⚙️ Настройки</h2>
            <div class="settings-list">
                <label class="toggle-row"><span>Без стен</span><input type="checkbox" id="toggle-walls" class="toggle"></label>
                <label class="toggle-row"><span>Лабиринт</span><input type="checkbox" id="toggle-maze" class="toggle"></label>
                <label class="toggle-row"><span>Звуки</span><input type="checkbox" id="toggle-sound" class="toggle"></label>
                <label class="toggle-row"><span>Вибрация</span><input type="checkbox" id="toggle-vibration" class="toggle"></label>
            </div>
            <button class="btn-main close-modal">Закрыть</button>
        </div>
    </div>

    <div id="modal-tasks" class="modal hidden">
        <div class="modal-content">
            <h2>📋 Задания</h2>
            <p id="tasks-reset" class="tasks-reset"></p>
            <div id="tasks-list" class="tasks-list"></div>
            <button class="btn-main close-modal">Закрыть</button>
        </div>
    </div>

    <div id="modal-achievements" class="modal hidden">
        <div class="modal-content">
            <h2>🏅 Достижения</h2>
            <div id="achievements-list" class="achievements-list"></div>
            <button class="btn-main close-modal">Закрыть</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
